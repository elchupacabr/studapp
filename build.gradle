buildscript {
    ext.kotlin_version = "1.3.72"

    repositories {
        google()
        jcenter()        // 🔴 ОБЯЗАТЕЛЬНО для старых проектов
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:3.5.4"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        jcenter()        // 🔴 ОБЯЗАТЕЛЬНО
        mavenCentral()
    }
}
